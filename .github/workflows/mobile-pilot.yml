name: Mobile PostgreSQL pilot
on:
  push:
    paths: ['mobile_game/**', 'tests_mobile/**', '.github/workflows/mobile-pilot.yml']
  pull_request:
    paths: ['mobile_game/**', 'tests_mobile/**', '.github/workflows/mobile-pilot.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: mobile_test
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: mobile_pilot_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mobile_test -d mobile_pilot_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r mobile_game/requirements.txt pytest==9.1.1
      - run: python -m pytest tests_mobile -q
        env:
          TEST_DATABASE_URL: postgresql://mobile_test:test-only@127.0.0.1:5432/mobile_pilot_test
